<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Screenshots of Lovely Home — house guide, bins, and sitter mode on a wall tablet.">
  <title>See the hub — Lovely Home</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="landing-wrap">
    <div class="landing-bg" aria-hidden="true"></div>

    <div class="site-banner">
      <div class="site-banner-inner">
        <span>Lovely Home on wall tablets &amp; browsers</span>
      </div>
    </div>

    <header class="site-header site-header--minimal">
      <nav>
        <a href="/">Home</a>
        <a href="support.html">Support</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </header>

    <main class="landing app-gallery-page">
      <div class="section-head app-gallery-intro">
        <h1>See the hub</h1>
        <p>A calm dashboard for the wall — house guide, routines, and the day at a glance.</p>
      </div>

      <div class="shot-grid">
        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/home.png" alt="Guest home screen with essentials for sitters" loading="lazy"></div>
          <figcaption>
            <strong>Guest home</strong>
            <span>Welcome message, essentials, weather, and bins — everything for the stay at a glance.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/house-guide.png" alt="House guide categories for rooms, appliances, and Wi-Fi" loading="lazy"></div>
          <figcaption>
            <strong>House guide</strong>
            <span>Rooms, appliances, Wi‑Fi, and local info — organised by topic with search.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/guide-shell.png" alt="Pet care guide topics for house sitters" loading="lazy"></div>
          <figcaption>
            <strong>Topic guides</strong>
            <span>Step-by-step care instructions — walks, meals, bedtime, and more.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/guide-article.png" alt="Appliance manuals grid in the house guide" loading="lazy"></div>
          <figcaption>
            <strong>Appliance manuals</strong>
            <span>Kitchen, laundry, heating, and TV — manuals searchable in one place.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/emergency.png" alt="Emergency contacts for owners, vet, and utilities" loading="lazy"></div>
          <figcaption>
            <strong>Emergency</strong>
            <span>Owners, vet, utilities, and safety info — one tap away for sitters.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/settings.png" alt="Settings for theme, clock, and tablet preferences" loading="lazy"></div>
          <figcaption>
            <strong>Settings</strong>
            <span>Theme, clock format, home screen size, and screensaver — synced across tablets.</span>
          </figcaption>
        </figure>
      </div>

      <div class="final-cta">
        <a class="btn btn-secondary" href="/">← Back to home</a>
      </div>
    </main>

    <footer class="site-footer">
      <p>© 2026 Mark Lovely. All rights reserved.</p>
      <p>
        <a href="support.html">Support</a>
        · <a href="privacy.html">Privacy</a>
        · <a href="mailto:support@lovely-home.co.uk">support@lovely-home.co.uk</a>
      </p>
    </footer>
  </div>
</body>
</html>
