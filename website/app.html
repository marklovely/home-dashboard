<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Screenshots of Lovely Home — house guide, controls, bins, and sitter mode on a wall tablet.">
  <title>See the hub — Lovely Home</title>
  <link rel="icon" href="lovely-home-logo.png" type="image/png">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="landing-wrap">
    <div class="landing-bg" aria-hidden="true"></div>

    <div class="site-banner">
      <div class="site-banner-inner">
        <span>Lovely Home on wall tablets &amp; browsers</span>
      </div>
    </div>

    <header class="site-header site-header--minimal">
      <nav>
        <a href="/">Home</a>
        <a href="support.html">Support</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </header>

    <main class="landing app-gallery-page">
      <div class="section-head app-gallery-intro">
        <h1>See the hub</h1>
        <p>A calm dashboard for the wall — house guide, routines, and the day at a glance.</p>
      </div>

      <div class="shot-grid">
        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/home.png" alt="Home screen with app tiles for controls, house guide, bins, and weather" loading="lazy"></div>
          <figcaption>
            <strong>Home</strong>
            <span>One screen for the things guests and sitters reach for most.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/house-guide.png" alt="House guide topics and quick Alexa routine buttons" loading="lazy"></div>
          <figcaption>
            <strong>House guide &amp; routines</strong>
            <span>Guide topics below, favourite scenes above — no app switching.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/controls.png" alt="Grid of Alexa routine buttons for lights, heating, and scenes" loading="lazy"></div>
          <figcaption>
            <strong>Controls</strong>
            <span>Big tap targets for bedtime, movie mode, and everyday scenes.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/guide-shell.png" alt="House guide article open on the hub" loading="lazy"></div>
          <figcaption>
            <strong>Guide reader</strong>
            <span>Step-by-step instructions with photos — written for your home.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/guide-article.png" alt="Hot water guide article with appliance photo" loading="lazy"></div>
          <figcaption>
            <strong>Appliance guides</strong>
            <span>Heating, TV, washing machine — whatever new sitters always ask about.</span>
          </figcaption>
        </figure>

        <figure class="shot shot--tablet">
          <div class="shot-frame"><img src="screenshots/settings.png" alt="Settings for theme, screensaver, and hub setup" loading="lazy"></div>
          <figcaption>
            <strong>Settings</strong>
            <span>Theme, screensaver, and hub details — synced across your tablets.</span>
          </figcaption>
        </figure>
      </div>

      <div class="final-cta">
        <a class="btn btn-secondary" href="/">← Back to home</a>
      </div>
    </main>

    <footer class="site-footer">
      <p>© 2026 Mark Lovely. All rights reserved.</p>
      <p>
        <a href="support.html">Support</a>
        · <a href="privacy.html">Privacy</a>
        · <a href="mailto:support@lovely-home.co.uk">support@lovely-home.co.uk</a>
      </p>
    </footer>
  </div>
</body>
</html>
