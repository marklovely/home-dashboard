# Hub platform site registry.
# Managed sites are provisioned via terraform/ (see docs/platform-terraform.md).
# Platform admin UI reads this manifest — see docs/platform-admin.md.

sites:
  demo:
    hostname: demo.lovely-home.co.uk
    hub_environment: demo
    vanilla: true
    terraform: true
    owner_emails: demo@lovely-home.co.uk
    attach_hub_api_binding: true

  wagtail:
    hostname: wagtail.lovely-hub.com
    hub_environment: wagtail
    vanilla: false
    terraform: true
    zone_name: lovely-hub.com
    attach_hub_api_binding: true

  lovely:
    hostname: lovely.lovely-hub.com
    hub_environment: production
    vanilla: false
    terraform: true
    zone_name: lovely-hub.com
    attach_hub_api_binding: true

  larchmount:
    hostname: larchmount.lovely-hub.com
    hub_environment: larchmount
    vanilla: false
    terraform: true
    zone_name: lovely-hub.com
    attach_hub_api_binding: true

  test-lovely:
    hostname: test-lovely.lovely-hub.com
    hub_environment: test-lovely
    vanilla: false
    terraform: true
    zone_name: lovely-hub.com
    attach_hub_api_binding: true

  test-free:
    hostname: test-free.lovely-hub.com
    hub_environment: test-free
    vanilla: false
    terraform: true
    zone_name: lovely-hub.com
    attach_hub_api_binding: true
