# Hub platform site registry.
# Managed sites are provisioned via terraform/ (see docs/platform-terraform.md).
# Platform admin UI reads this manifest — see docs/platform-admin.md.

sites:
  production:
    hostname: dashboard.lovely-home.co.uk
    hub_environment: production
    vanilla: false
    terraform: true

  test:
    hostname: test.lovely-home.co.uk
    hub_environment: test
    vanilla: true
    terraform: true
    attach_hub_api_binding: true

  sandbox:
    hostname: sandbox.lovely-home.co.uk
    hub_environment: sandbox
    vanilla: true
    terraform: true
    attach_hub_api_binding: true

  demo:
    hostname: demo.lovely-home.co.uk
    hub_environment: demo
    vanilla: true
    terraform: true
    owner_emails: demo@lovely-home.co.uk
    attach_hub_api_binding: true

  dev:
    hostname: dev.lovely-home.co.uk
    hub_environment: dev
    vanilla: true
    terraform: true
    owner_emails: marklovely67@gmail.com
    attach_hub_api_binding: true

  smith:
    hostname: smith.lovely-hub.com
    hub_environment: smith
    vanilla: false
    terraform: true
    zone_name: lovely-hub.com
    attach_hub_api_binding: true

  wagtail:
    hostname: wagtail.lovely-hub.com
    hub_environment: wagtail
    vanilla: false
    terraform: true
    zone_name: lovely-hub.com
    attach_hub_api_binding: true

  e2e-nqnrfvy8:
    hostname: e2e-nqnrfvy8.lovely-hub.com
    hub_environment: e2e-nqnrfvy8
    vanilla: false
    terraform: true
    zone_name: lovely-hub.com
    attach_hub_api_binding: false

  e2e-dy940psa:
