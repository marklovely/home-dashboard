name: CI

# Continuous integration only — no hub fleet deploy. Roll out hubs via CD — Hub Pages.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run lint
      - run: npm run test
      - name: Build (shared hub artifact smoke)
        run: VITE_DEPLOYMENT_MODE=home npm run build
      - run: node scripts/check-dist-secrets.js
      - run: npm run check --prefix worker
