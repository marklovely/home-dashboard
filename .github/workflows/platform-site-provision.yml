name: Platform site provision

on:
  push:
    branches:
      - main
    paths:
      - platform/sites.yaml
  workflow_dispatch:
    inputs:
      site_id:
        description: Site id to provision (e.g. demo)
        required: true
        type: string
      skip_pages:
        description: Skip Pages frontend deploy
        required: false
        type: boolean
        default: false
      skip_platform_admin:
        description: Skip platform admin redeploy
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platform-site-provision-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.site_id) || format('push-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  detect-new-sites:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      site_ids: ${{ steps.detect.outputs.site_ids }}
      platform_site_ids: ${{ steps.detect.outputs.platform_site_ids }}
      customer_site_ids: ${{ steps.detect.outputs.customer_site_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: detect
        run: node scripts/detect-new-sites-from-yaml.mjs

  provision-auto-platform:
    if: github.event_name == 'push' && needs.detect-new-sites.outputs.platform_site_ids != '[]'
    needs: detect-new-sites
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site_id: ${{ fromJson(needs.detect-new-sites.outputs.platform_site_ids) }}
    uses: ./.github/workflows/platform-site-provision-reusable.yml
    with:
      site_id: ${{ matrix.site_id }}
      terraform_stack: platform
      skip_pages: false
      skip_platform_admin: false
    secrets: inherit

  provision-auto-customers:
    if: github.event_name == 'push' && needs.detect-new-sites.outputs.customer_site_ids != '[]'
    needs: detect-new-sites
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site_id: ${{ fromJson(needs.detect-new-sites.outputs.customer_site_ids) }}
    uses: ./.github/workflows/platform-site-provision-reusable.yml
    with:
      site_id: ${{ matrix.site_id }}
      terraform_stack: customers
      skip_pages: false
      skip_platform_admin: true
    secrets: inherit

  resolve-manual-stack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      terraform_stack: ${{ steps.resolve.outputs.terraform_stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: resolve
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: |
          STACK=$(node scripts/terraform-stack-for-site.mjs "$SITE_ID" --guess)
          echo "terraform_stack=$STACK" >> "$GITHUB_OUTPUT"

  provision-manual:
    if: github.event_name == 'workflow_dispatch'
    needs: resolve-manual-stack
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/platform-site-provision-reusable.yml
    with:
      site_id: ${{ inputs.site_id }}
      terraform_stack: ${{ needs.resolve-manual-stack.outputs.terraform_stack }}
      skip_pages: ${{ inputs.skip_pages }}
      skip_platform_admin: ${{ inputs.skip_platform_admin || needs.resolve-manual-stack.outputs.terraform_stack == 'customers' }}
    secrets: inherit
