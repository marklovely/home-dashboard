name: Platform sync archive GitHub secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-terraform-state-platform
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      TF_STATE_R2_BUCKET: ${{ secrets.TF_STATE_R2_BUCKET }}
      TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
      TERRAFORM_STACK: platform
      TF_VAR_terraform_stack: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Require remote Terraform state
        run: |
          if [ -z "${{ secrets.TF_STATE_R2_BUCKET }}" ] || [ -z "${{ secrets.TF_STATE_R2_ENDPOINT }}" ]; then
            echo "::error::Configure TF_STATE_R2_BUCKET and TF_STATE_R2_ENDPOINT repo secrets."
            exit 1
          fi
          if [ -z "${{ secrets.PLATFORM_GITHUB_TOKEN }}" ]; then
            echo "::error::Configure PLATFORM_GITHUB_TOKEN (needs repo secrets write) to set archive GitHub secrets."
            exit 1
          fi

      - name: Terraform init (R2 backend)
        run: bash scripts/terraform-init-r2.sh platform

      - name: Assert Terraform state was split
        run: node scripts/assert-terraform-stack-state.mjs platform

      - name: Copy archive secrets from Terraform state
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform state pull | node scripts/sync-platform-archive-github-secrets.mjs --from-state-stdin
