name: Platform sync archive GitHub secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Require remote Terraform state
        run: |
          if [ -z "${{ secrets.TF_STATE_R2_BUCKET }}" ] || [ -z "${{ secrets.TF_STATE_R2_ENDPOINT }}" ]; then
            echo "::error::Configure TF_STATE_R2_BUCKET and TF_STATE_R2_ENDPOINT repo secrets."
            exit 1
          fi
          if [ -z "${{ secrets.PLATFORM_GITHUB_TOKEN }}" ]; then
            echo "::error::Configure PLATFORM_GITHUB_TOKEN (needs repo secrets write) to set archive GitHub secrets."
            exit 1
          fi

      - name: Terraform init (R2 backend)
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_R2_BUCKET }}" \
            -backend-config="key=home-dashboard/hub.tfstate" \
            -backend-config="region=auto" \
            -backend-config='endpoints={s3="${{ secrets.TF_STATE_R2_ENDPOINT }}"}' \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="use_path_style=true"

      - name: Copy archive secrets from Terraform state
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform state pull | node scripts/sync-platform-archive-github-secrets.mjs --from-state-stdin
