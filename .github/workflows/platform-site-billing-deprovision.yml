name: Platform site billing deprovision

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Site id to archive and deprovision (must still be in sites.yaml)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-stack:
    runs-on: ubuntu-latest
    outputs:
      terraform_stack: ${{ steps.resolve.outputs.terraform_stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: resolve
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: |
          STACK=$(node scripts/terraform-stack-for-site.mjs "$SITE_ID")
          echo "terraform_stack=$STACK" >> "$GITHUB_OUTPUT"

  billing-deprovision:
    needs: resolve-stack
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.resolve-stack.outputs.terraform_stack == 'customers' && format('platform-terraform-state-customers-{0}', inputs.site_id) || format('platform-terraform-state-{0}', needs.resolve-stack.outputs.terraform_stack) }}
      cancel-in-progress: false
    env:
      TZ: Europe/London
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CUSTOMER_CLOUDFLARE_ZONE_ID: ${{ secrets.CUSTOMER_CLOUDFLARE_ZONE_ID }}
      CUSTOMER_ZONE_NAME: ${{ secrets.CUSTOMER_ZONE_NAME }}
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      SUPPORT_OWNER_EMAILS: ${{ secrets.SUPPORT_OWNER_EMAILS }}
      PLATFORM_OPERATOR_EMAILS: ${{ secrets.PLATFORM_OPERATOR_EMAILS }}
      SITTER_EMAILS: ${{ secrets.SITTER_EMAILS }}
      HUB_PROXY_SECRETS_JSON: ${{ secrets.HUB_PROXY_SECRETS_JSON }}
      PLATFORM_GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
      PLATFORM_CF_API_TOKEN: ${{ secrets.PLATFORM_CF_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      STRIPE_PRICE_ID_YEARLY: ${{ secrets.STRIPE_PRICE_ID_YEARLY }}
      STRIPE_SECRET_KEY_LIVE: ${{ secrets.STRIPE_SECRET_KEY_LIVE }}
      STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
      STRIPE_PRICE_ID_LIVE: ${{ secrets.STRIPE_PRICE_ID_LIVE }}
      STRIPE_PRICE_ID_YEARLY_LIVE: ${{ secrets.STRIPE_PRICE_ID_YEARLY_LIVE }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CUSTOMER_EMAIL_FROM: ${{ secrets.CUSTOMER_EMAIL_FROM }}
      PLATFORM_SITE_ARCHIVE_SECRET: ${{ secrets.PLATFORM_SITE_ARCHIVE_SECRET }}
      PLATFORM_HEALTH_CF_ACCESS_CLIENT_ID: ${{ secrets.PLATFORM_HEALTH_CF_ACCESS_CLIENT_ID }}
      PLATFORM_HEALTH_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PLATFORM_HEALTH_CF_ACCESS_CLIENT_SECRET }}
      PLATFORM_ARCHIVE_R2_BUCKET: ${{ secrets.PLATFORM_ARCHIVE_R2_BUCKET }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      TF_STATE_R2_BUCKET: ${{ secrets.TF_STATE_R2_BUCKET }}
      TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
      TERRAFORM_STACK: ${{ needs.resolve-stack.outputs.terraform_stack }}
      TF_VAR_terraform_stack: ${{ needs.resolve-stack.outputs.terraform_stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate site_id
        id: validate
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: node scripts/validate-billing-deprovision-site-id.mjs

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Require remote Terraform state
        run: |
          if [ -z "${{ secrets.TF_STATE_R2_BUCKET }}" ] || [ -z "${{ secrets.TF_STATE_R2_ENDPOINT }}" ]; then
            echo "::error::Configure TF_STATE_R2_BUCKET and TF_STATE_R2_ENDPOINT repo secrets. See docs/platform-provision.md"
            exit 1
          fi

      - name: Terraform init (R2 backend)
        run: bash scripts/terraform-init-r2.sh "${{ needs.resolve-stack.outputs.terraform_stack }}" "${{ inputs.site_id }}"

      - name: Assert Terraform state was split
        run: node scripts/assert-terraform-stack-state.mjs "${{ needs.resolve-stack.outputs.terraform_stack }}" "${{ inputs.site_id }}"

      - name: Install dependencies
        run: npm ci

      - name: Archive hub backup before teardown
        id: archive
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: |
          set -euo pipefail
          node scripts/archive-hub-site-backup.mjs "$SITE_ID" | tee /tmp/archive.log
          if ! grep -q 'Archived to r2://' /tmp/archive.log; then
            echo "::error::Archive finished without an R2 object key — refusing to remove the site from the registry."
            exit 1
          fi
          KEY=$(grep 'Archived to r2://' /tmp/archive.log | head -1 | sed 's/.*r2:\/\/[^/]*\///')
          echo "archive_r2_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Refresh main before registry delete
        id: sync_main
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: node scripts/sync-git-main-before-site-delete.mjs "$SITE_ID"

      - name: Remove site from registry (local)
        if: steps.sync_main.outputs.site_present != 'false'
        env:
          SITE_ID: ${{ inputs.site_id }}
          HOSTNAME: ${{ steps.validate.outputs.hostname }}
        run: |
          node scripts/platform-site-manage.mjs delete \
            --site-id "$SITE_ID" \
            --confirm-hostname "$HOSTNAME"

      - name: Validate Terraform
        run: |
          cd terraform
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Run tests
        run: npm run test

      - name: Replay registry delete onto origin/main
        if: steps.sync_main.outputs.site_present != 'false'
        env:
          SITE_ID: ${{ inputs.site_id }}
          PLATFORM_GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
        run: node scripts/replay-site-registry-onto-main.mjs "$SITE_ID"

      - name: Check PR token
        run: |
          if [ -z "${{ secrets.PLATFORM_GITHUB_TOKEN }}" ]; then
            echo "::error title=Missing PLATFORM_GITHUB_TOKEN::Add repo secret PLATFORM_GITHUB_TOKEN (PAT with contents:write + pull_requests:write). Use the same token as platform admin."
            exit 1
          fi

      - name: Open registry removal pull request
        if: steps.sync_main.outputs.site_present != 'false'
        id: open_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          branch: platform/site-${{ inputs.site_id }}-billing-deprovision-${{ github.run_id }}
          delete-branch: true
          title: "platform: billing deprovision ${{ inputs.site_id }}"
          body: |
            Automated billing deprovision from **Platform billing** (Stripe cancel/delete).

            **Site:** `${{ inputs.site_id }}`

            Hub archive (if configured) completed before this PR. **After merge**, [`platform-site-deprovision.yml`](../.github/workflows/platform-site-deprovision.yml) tears down Terraform + Worker and redeploys platform admin.

            Triggered by Stripe billing webhook or manual **Platform site billing deprovision** workflow.

      - name: Require pull request
        if: steps.sync_main.outputs.site_present != 'false' && steps.open_pr.outputs.pull-request-number == ''
        run: |
          echo "::error::No registry changes to commit — is ${{ inputs.site_id }} already removed from platform/sites.yaml?"
          exit 1

      - name: Record archive pointer in platform billing D1
        if: steps.archive.outputs.archive_r2_key != ''
        continue-on-error: true
        env:
          SITE_ID: ${{ inputs.site_id }}
          ARCHIVE_R2_KEY: ${{ steps.archive.outputs.archive_r2_key }}
        run: |
          node scripts/update-billing-archive-key.mjs "$SITE_ID" "$ARCHIVE_R2_KEY"
