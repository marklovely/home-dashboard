name: Platform sync archive secret

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Wrangler env / site id (leave empty to sync all Workers)
        required: false
        type: string
      dry_run:
        description: Print targets only — do not call wrangler
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLATFORM_SITE_ARCHIVE_SECRET: ${{ secrets.PLATFORM_SITE_ARCHIVE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Require archive secret
        run: |
          if [ -z "$PLATFORM_SITE_ARCHIVE_SECRET" ]; then
            echo "::error::Configure PLATFORM_SITE_ARCHIVE_SECRET repo secret first."
            exit 1
          fi

      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Sync PLATFORM_SITE_ARCHIVE_SECRET to Workers
        run: |
          set -euo pipefail
          ARGS=( --continue )
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=( --dry-run ); fi
          if [ -n "${{ inputs.site_id }}" ]; then ARGS+=( --site "${{ inputs.site_id }}" ); fi
          node scripts/sync-platform-site-archive-secret.mjs "${ARGS[@]}"
