name: Hub lifecycle (Stripe test)

on:
  workflow_dispatch:

concurrency:
  group: hub-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Signup checkout provision cancel teardown
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Europe/London
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_MODE: ${{ vars.STRIPE_MODE }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      PLATFORM_API_ORIGIN: https://platform.lovely-home.co.uk
      MARKETING_ORIGIN: https://lovely-home.co.uk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refuse live Stripe
        run: |
          set -euo pipefail
          MODE="$(printf '%s' "${STRIPE_MODE:-test}" | tr '[:upper:]' '[:lower:]')"
          if [ "$MODE" = "live" ]; then
            echo "::error::STRIPE_MODE is live. Switch platform admin back to test before running this workflow."
            exit 1
          fi
          case "${STRIPE_SECRET_KEY:-}" in
            sk_test_*|rk_test_*) ;;
            *)
              echo "::error::STRIPE_SECRET_KEY must be a Stripe test key."
              exit 1
              ;;
          esac
          if [ -z "${E2E_OWNER_EMAIL:-}" ]; then
            echo "::error::Add repo secret E2E_OWNER_EMAIL."
            exit 1
          fi

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:lifecycle

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
