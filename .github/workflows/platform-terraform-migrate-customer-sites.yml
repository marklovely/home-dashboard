name: Split customer Terraform state

# One-shot: copy combined customers.tfstate into customers/{siteId}.tfstate.
# Does not delete the combined object. Run after this change is on main, before
# overlapping customer hub provisions.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type split-sites to peel each household hub into its own Terraform state file
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-terraform-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      TF_STATE_R2_BUCKET: ${{ secrets.TF_STATE_R2_BUCKET }}
      TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Confirm
        run: |
          if [ "${{ inputs.confirm }}" != "split-sites" ]; then
            echo "::error::Type split-sites in the confirm input to run this migration."
            exit 1
          fi
          if [ -z "${{ secrets.TF_STATE_R2_BUCKET }}" ] || [ -z "${{ secrets.TF_STATE_R2_ENDPOINT }}" ]; then
            echo "::error::Configure TF_STATE_R2_BUCKET and TF_STATE_R2_ENDPOINT."
            exit 1
          fi

      - name: Split and push per-site backends
        run: bash scripts/migrate-terraform-state-customer-sites.sh split-sites
