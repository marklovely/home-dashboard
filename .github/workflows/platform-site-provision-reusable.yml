name: Platform site provision (reusable)

on:
  workflow_call:
    inputs:
      site_id:
        required: true
        type: string
      skip_pages:
        required: false
        type: boolean
        default: false
      skip_platform_admin:
        required: false
        type: boolean
        default: false
      terraform_stack:
        description: platform (lovely-home.co.uk + admin) or customers (lovely-hub.com)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ inputs.terraform_stack == 'customers' && format('platform-terraform-state-customers-{0}', inputs.site_id) || format('platform-terraform-state-{0}', inputs.terraform_stack) }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CUSTOMER_CLOUDFLARE_ZONE_ID: ${{ secrets.CUSTOMER_CLOUDFLARE_ZONE_ID }}
      CUSTOMER_ZONE_NAME: ${{ secrets.CUSTOMER_ZONE_NAME }}
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      SUPPORT_OWNER_EMAILS: ${{ secrets.SUPPORT_OWNER_EMAILS }}
      PLATFORM_OPERATOR_EMAILS: ${{ secrets.PLATFORM_OPERATOR_EMAILS }}
      SITTER_EMAILS: ${{ secrets.SITTER_EMAILS }}
      PLATFORM_GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
      PLATFORM_CF_API_TOKEN: ${{ secrets.PLATFORM_CF_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      STRIPE_PRICE_ID_YEARLY: ${{ secrets.STRIPE_PRICE_ID_YEARLY }}
      STRIPE_SECRET_KEY_LIVE: ${{ secrets.STRIPE_SECRET_KEY_LIVE }}
      STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
      STRIPE_PRICE_ID_LIVE: ${{ secrets.STRIPE_PRICE_ID_LIVE }}
      STRIPE_PRICE_ID_YEARLY_LIVE: ${{ secrets.STRIPE_PRICE_ID_YEARLY_LIVE }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CUSTOMER_EMAIL_FROM: ${{ secrets.CUSTOMER_EMAIL_FROM }}
      HUB_PROXY_SECRETS_JSON: ${{ secrets.HUB_PROXY_SECRETS_JSON }}
      PLATFORM_SITE_ARCHIVE_SECRET: ${{ secrets.PLATFORM_SITE_ARCHIVE_SECRET }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      TF_STATE_R2_BUCKET: ${{ secrets.TF_STATE_R2_BUCKET }}
      TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
      TERRAFORM_STACK: ${{ inputs.terraform_stack }}
      TF_VAR_terraform_stack: ${{ inputs.terraform_stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate site_id
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: node scripts/validate-deploy-site-id.mjs

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          # Wrapper redacts sensitive outputs (hub_proxy_secrets) as { sensitive: true, value }.
          terraform_wrapper: false

      - name: Require remote Terraform state
        run: |
          if [ -z "${{ secrets.TF_STATE_R2_BUCKET }}" ] || [ -z "${{ secrets.TF_STATE_R2_ENDPOINT }}" ]; then
            echo "::error::Configure TF_STATE_R2_BUCKET and TF_STATE_R2_ENDPOINT repo secrets. See docs/platform-provision.md"
            exit 1
          fi
          if [ "${{ inputs.terraform_stack }}" != "platform" ] && [ "${{ inputs.terraform_stack }}" != "customers" ]; then
            echo "::error::terraform_stack must be platform or customers."
            exit 1
          fi

      - name: Terraform init (R2 backend)
        run: bash scripts/terraform-init-r2.sh "${{ inputs.terraform_stack }}" "${{ inputs.site_id }}"

      - name: Assert Terraform state was split
        run: node scripts/assert-terraform-stack-state.mjs "${{ inputs.terraform_stack }}" "${{ inputs.site_id }}"

      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Verify Cloudflare API token
        run: bash scripts/verify-cloudflare-api-token.sh

      # Customer owner emails live in the billing database, not in the public
      # repository, so Access policies are built from a lookup at apply time.
      - name: Resolve site owner emails from billing
        run: node scripts/fetch-site-owner-emails.mjs "${{ inputs.site_id }}" --github-env

      - name: Clear previous setup failure
        continue-on-error: true
        run: node scripts/mark-hub-setup-failed.mjs "${{ inputs.site_id }}" --kind provision --clear

      - name: Provision hub site
        run: |
          ARGS=( "${{ inputs.site_id }}" )
          if [ "${{ inputs.skip_pages }}" = "true" ]; then ARGS+=( --skip-pages ); fi
          if [ "${{ inputs.skip_platform_admin }}" = "true" ]; then ARGS+=( --skip-platform-admin ); fi
          node scripts/provision-hub-site.mjs "${ARGS[@]}"

      - name: Commit provisioned site registry flag
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          SITE_ID: ${{ inputs.site_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PLATFORM_GITHUB_TOKEN not set — skipping sites.yaml commit (set repo secret or open a PR for attach_hub_api_binding manually)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/replay-site-registry-onto-main.mjs "$SITE_ID"
          git add platform/sites.yaml worker/wrangler.toml platform-admin/public/platform-manifest.json
          if git diff --staged --quiet; then
            echo "No provision follow-up changes to commit."
            exit 0
          fi
          BRANCH="platform/provision-${SITE_ID}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "platform: mark ${SITE_ID} provisioned (attach HUB_API, sync D1 ids, manifest contract)"
          git config --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          gh pr create \
            --title "platform: mark ${SITE_ID} provisioned (attach HUB_API, sync D1 ids, manifest contract)" \
            --body "$(cat <<EOF
          Automated provision follow-up from **Platform site provision**.

          Site \`${SITE_ID}\` finished Terraform, Worker deploy, and Pages. This PR sets \`attach_hub_api_binding: true\` in \`platform/sites.yaml\`, syncs D1 ids in \`worker/wrangler.toml\`, and commits the site's Terraform contract into \`platform-admin/public/platform-manifest.json\`.

          The manifest commit matters: Cloudflare Pages rebuilds platform admin from git with no Terraform state, so contracts are only preserved from the committed manifest. Without it the site shows "not provisioned" again after the next platform-admin deploy.

          Auto-merge runs when required checks pass (see \`platform-site-pr-automerge.yml\`).
          EOF
          )" \
            --base main \
            --head "$BRANCH"

      - name: Record setup failure for the signup page
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          node scripts/mark-hub-setup-failed.mjs "${{ inputs.site_id }}"
          --kind provision
          --message "Hub provision workflow failed (run ${{ github.run_id }})."
