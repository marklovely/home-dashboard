name: Platform site provision (reusable)

on:
  workflow_call:
    inputs:
      site_id:
        required: true
        type: string
      skip_pages:
        required: false
        type: boolean
        default: false
      skip_platform_admin:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: platform-terraform-state
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CUSTOMER_CLOUDFLARE_ZONE_ID: ${{ secrets.CUSTOMER_CLOUDFLARE_ZONE_ID }}
      CUSTOMER_ZONE_NAME: ${{ secrets.CUSTOMER_ZONE_NAME }}
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      PLATFORM_OPERATOR_EMAILS: ${{ secrets.PLATFORM_OPERATOR_EMAILS }}
      SITTER_EMAILS: ${{ secrets.SITTER_EMAILS }}
      PLATFORM_GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
      PLATFORM_CF_API_TOKEN: ${{ secrets.PLATFORM_CF_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      HUB_PROXY_SECRETS_JSON: ${{ secrets.HUB_PROXY_SECRETS_JSON }}
      PLATFORM_SITE_ARCHIVE_SECRET: ${{ secrets.PLATFORM_SITE_ARCHIVE_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate site_id
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: node scripts/validate-deploy-site-id.mjs

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Require remote Terraform state
        run: |
          if [ -z "${{ secrets.TF_STATE_R2_BUCKET }}" ] || [ -z "${{ secrets.TF_STATE_R2_ENDPOINT }}" ]; then
            echo "::error::Configure TF_STATE_R2_BUCKET and TF_STATE_R2_ENDPOINT repo secrets. See docs/platform-provision.md"
            exit 1
          fi

      - name: Terraform init (R2 backend)
        working-directory: terraform
        run: |
          set -euo pipefail
          init_args=(
            -backend-config="bucket=${{ secrets.TF_STATE_R2_BUCKET }}"
            -backend-config="key=home-dashboard/hub.tfstate"
            -backend-config="region=auto"
            -backend-config='endpoints={s3="${{ secrets.TF_STATE_R2_ENDPOINT }}"}'
            -backend-config="skip_credentials_validation=true"
            -backend-config="skip_metadata_api_check=true"
            -backend-config="skip_region_validation=true"
            -backend-config="skip_requesting_account_id=true"
            -backend-config="use_path_style=true"
          )
          for attempt in 1 2 3; do
            if terraform init "${init_args[@]}"; then
              exit 0
            fi
            echo "terraform init attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          echo "terraform init failed after 3 attempts"
          exit 1

      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Verify Cloudflare API token
        run: bash scripts/verify-cloudflare-api-token.sh

      - name: Provision hub site
        run: |
          ARGS=( "${{ inputs.site_id }}" )
          if [ "${{ inputs.skip_pages }}" = "true" ]; then ARGS+=( --skip-pages ); fi
          if [ "${{ inputs.skip_platform_admin }}" = "true" ]; then ARGS+=( --skip-platform-admin ); fi
          node scripts/provision-hub-site.mjs "${ARGS[@]}"

      - name: Commit provisioned site registry flag
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          SITE_ID: ${{ inputs.site_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PLATFORM_GITHUB_TOKEN not set — skipping sites.yaml commit (set repo secret or open a PR for attach_hub_api_binding manually)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add platform/sites.yaml worker/wrangler.toml
          if git diff --staged --quiet; then
            echo "No provision follow-up changes to commit."
            exit 0
          fi
          BRANCH="platform/provision-${SITE_ID}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "platform: mark ${SITE_ID} provisioned (attach HUB_API, sync D1 ids)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          gh pr create \
            --title "platform: mark ${SITE_ID} provisioned (attach HUB_API, sync D1 ids)" \
            --body "$(cat <<EOF
          Automated provision follow-up from **Platform site provision**.

          Site \`${SITE_ID}\` finished Terraform, Worker deploy, and Pages. This PR sets \`attach_hub_api_binding: true\` in \`platform/sites.yaml\` and syncs D1 ids in \`worker/wrangler.toml\`.

          Auto-merge runs when required checks pass (see \`platform-site-pr-automerge.yml\`).
          EOF
          )" \
            --base main \
            --head "$BRANCH"
