name: CD — Hub Pages

# Continuous delivery: build the dashboard once, then wrangler-deploy to selected hubs.
# CI (lint/test/build) runs on every push/PR — this workflow is manual only.
on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites to deploy — all, or comma-separated (e.g. demo,larchmount)'
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: cd-hub-pages
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      site_ids: ${{ steps.resolve.outputs.site_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: resolve
        run: node scripts/resolve-hub-deploy-sites.mjs "${{ inputs.sites }}"

  build:
    needs: resolve
    if: needs.resolve.outputs.site_ids != '[]'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build shared hub Pages artifact
        run: bash scripts/build-hub-pages-artifact.sh
      - name: Upload hub Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-pages-dist
          retention-days: 14
          path: |
            dist/
            dist-hub-functions/

  deploy:
    needs: [resolve, build]
    if: needs.resolve.outputs.site_ids != '[]'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site_id: ${{ fromJson(needs.resolve.outputs.site_ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Download hub Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: hub-pages-dist
      - name: Install worker dependencies (wrangler)
        run: npm ci --prefix worker
      - name: Deploy to hub
        run: bash scripts/deploy-hub-pages-from-artifact.sh "${{ matrix.site_id }}"
