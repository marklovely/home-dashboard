name: Platform site manage

on:
  workflow_dispatch:
    inputs:
      action:
        description: create, update, or delete
        required: true
        type: choice
        options:
          - create
          - update
          - delete
      payload:
        description: JSON payload from platform admin API
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  manage-site:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install dependencies
        run: npm ci

      - name: Refresh main before registry delete
        if: inputs.action == 'delete'
        env:
          SITE_MANAGE_PAYLOAD: ${{ inputs.payload }}
        run: |
          SITE_ID="$(node -e 'const p=JSON.parse(process.env.SITE_MANAGE_PAYLOAD||"{}"); process.stdout.write(String(p.siteId||"").trim())')"
          if [ -z "$SITE_ID" ]; then
            echo "::error::delete payload missing siteId"
            exit 1
          fi
          node scripts/sync-git-main-before-site-delete.mjs "$SITE_ID"

      - name: Apply registry changes
        id: manage
        env:
          SITE_MANAGE_ACTION: ${{ inputs.action }}
          SITE_MANAGE_PAYLOAD: ${{ inputs.payload }}
        run: node scripts/platform-site-manage-from-payload.mjs

      - name: Validate Terraform
        run: |
          cd terraform
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Run registry test
        run: npm test -- tests/platformSitesYaml.test.js

      - name: Check PR token
        run: |
          if [ -z "${{ secrets.PLATFORM_GITHUB_TOKEN }}" ]; then
            echo "::error title=Missing PLATFORM_GITHUB_TOKEN::Add repo secret PLATFORM_GITHUB_TOKEN (PAT with contents:write + pull_requests:write). Use the same token as platform admin. Or enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests."
            exit 1
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # Default GITHUB_TOKEN cannot open PRs unless repo Settings → Actions →
          # "Allow GitHub Actions to create and approve pull requests" is enabled.
          # Use the same PAT as platform admin (repo secret PLATFORM_GITHUB_TOKEN).
          token: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          # One branch per site+action so a second Stripe event updates the
          # existing PR instead of opening a duplicate (do not suffix run_id).
          branch: platform/site-${{ steps.manage.outputs.site_id }}-${{ inputs.action }}
          delete-branch: true
          title: "platform: ${{ inputs.action }} site ${{ steps.manage.outputs.site_id }}"
          body: |
            Automated site registry change from **Platform Admin**.

            **Action:** `${{ inputs.action }}`
            **Site:** `${{ steps.manage.outputs.site_id }}`

            ## After merge

            **Automated (v4):** merging to `main` triggers [`platform-site-provision.yml`](../.github/workflows/platform-site-provision.yml) for new sites (Terraform → Worker → Pages → manifest). Requires remote Terraform state + GitHub secrets — see [docs/platform-provision.md](../docs/platform-provision.md).

            **Manual retry:** Platform admin → **Provision** on the site card, or workflow dispatch with `site_id`.

            **Delete only:** after merge, [`platform-site-deprovision.yml`](../.github/workflows/platform-site-deprovision.yml) runs automatically (Worker delete → Terraform destroy → manifest). See [docs/platform-provision.md](../docs/platform-provision.md#v5--automated-deprovision).

            Triggered by platform operator via `platform-site-manage` workflow.

      - name: Record registry failure for the signup page
        if: failure() && inputs.action == 'create'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_MANAGE_PAYLOAD: ${{ inputs.payload }}
        run: |
          SITE_ID="$(node -e 'try { process.stdout.write(String(JSON.parse(process.env.SITE_MANAGE_PAYLOAD || "{}").siteId || "").trim()) } catch { process.exit(0) }')"
          if [ -z "$SITE_ID" ]; then
            echo "No site id in payload; skip billing failure record."
            exit 0
          fi
          node scripts/mark-hub-setup-failed.mjs "$SITE_ID" --kind registry --message "Hub registry workflow failed (run ${{ github.run_id }})."
