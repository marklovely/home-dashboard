name: Platform site manage

on:
  workflow_dispatch:
    inputs:
      action:
        description: create, update, or delete
        required: true
        type: choice
        options:
          - create
          - update
          - delete
      payload:
        description: JSON payload from platform admin API
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  manage-site:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply registry changes
        id: manage
        env:
          SITE_MANAGE_ACTION: ${{ inputs.action }}
          SITE_MANAGE_PAYLOAD: ${{ inputs.payload }}
        run: node scripts/platform-site-manage-from-payload.mjs

      - name: Validate Terraform
        run: |
          cd terraform
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Run registry test
        run: npm test -- tests/platformSitesYaml.test.js

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: platform/site-${{ steps.manage.outputs.site_id }}-${{ inputs.action }}-${{ github.run_id }}
          delete-branch: true
          title: "platform: ${{ inputs.action }} site ${{ steps.manage.outputs.site_id }}"
          body: |
            Automated site registry change from **Platform Admin**.

            **Action:** `${{ inputs.action }}`
            **Site:** `${{ steps.manage.outputs.site_id }}`

            ## After merge

            1. Add or update the matching block in `terraform/environments/hub.tfvars` (local, not committed).
            2. `cd terraform && terraform apply -var-file=environments/hub.tfvars`
            3. For **create**: `node scripts/sync-wrangler-from-terraform.mjs ${{ steps.manage.outputs.site_id }}`
            4. For **create**: `cd worker && npm run d1:migrate:${{ steps.manage.outputs.site_id }} && npm run deploy:${{ steps.manage.outputs.site_id }}`
            5. For **delete**: `terraform destroy -target='module.hub_site["${{ steps.manage.outputs.site_id }}"]'` then remove from hub.tfvars.
            6. `npm run platform:manifest` and redeploy platform admin.

            Triggered by platform operator via `platform-site-manage` workflow.
