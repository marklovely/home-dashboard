name: Platform site deploy

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Wrangler env / site id (e.g. test, sandbox)
        required: true
        type: choice
        options:
          - test
          - sandbox
      skip_migrate:
        description: Skip D1 migrations
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Apply D1 migrations
        if: ${{ inputs.skip_migrate != true }}
        run: npm run d1:migrate:${{ inputs.site_id }} --prefix worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npm run deploy:${{ inputs.site_id }} --prefix worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
