name: Platform site deploy

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Wrangler env / site id (e.g. test, sandbox, demo)
        required: true
        type: string
      skip_migrate:
        description: Skip D1 migrations
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Validate site_id
        id: validate
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: node scripts/validate-deploy-site-id.mjs

      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Apply D1 migrations
        if: ${{ inputs.skip_migrate != true }}
        run: npm run "d1:migrate:${SITE_ID}" --prefix worker
        env:
          SITE_ID: ${{ steps.validate.outputs.site_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npm run "deploy:${SITE_ID}" --prefix worker
        env:
          SITE_ID: ${{ steps.validate.outputs.site_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
