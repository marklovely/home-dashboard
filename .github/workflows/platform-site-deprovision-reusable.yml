name: Platform site deprovision (reusable)

on:
  workflow_call:
    inputs:
      site_id:
        required: true
        type: string
      skip_platform_admin:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platform-terraform-state
  cancel-in-progress: false

jobs:
  deprovision:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CUSTOMER_CLOUDFLARE_ZONE_ID: ${{ secrets.CUSTOMER_CLOUDFLARE_ZONE_ID }}
      CUSTOMER_ZONE_NAME: ${{ secrets.CUSTOMER_ZONE_NAME }}
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      SUPPORT_OWNER_EMAILS: ${{ secrets.SUPPORT_OWNER_EMAILS }}
      PLATFORM_OPERATOR_EMAILS: ${{ secrets.PLATFORM_OPERATOR_EMAILS }}
      SITTER_EMAILS: ${{ secrets.SITTER_EMAILS }}
      HUB_PROXY_SECRETS_JSON: ${{ secrets.HUB_PROXY_SECRETS_JSON }}
      PLATFORM_GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
      PLATFORM_CF_API_TOKEN: ${{ secrets.PLATFORM_CF_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      STRIPE_PRICE_ID_YEARLY: ${{ secrets.STRIPE_PRICE_ID_YEARLY }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      PLATFORM_SITE_ARCHIVE_SECRET: ${{ secrets.PLATFORM_SITE_ARCHIVE_SECRET }}
      PLATFORM_HEALTH_CF_ACCESS_CLIENT_ID: ${{ secrets.PLATFORM_HEALTH_CF_ACCESS_CLIENT_ID }}
      PLATFORM_HEALTH_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PLATFORM_HEALTH_CF_ACCESS_CLIENT_SECRET }}
      PLATFORM_ARCHIVE_R2_BUCKET: ${{ secrets.PLATFORM_ARCHIVE_R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate site_id
        id: validate
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: node scripts/validate-deprovision-site-id.mjs

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Require remote Terraform state
        run: |
          if [ -z "${{ secrets.TF_STATE_R2_BUCKET }}" ] || [ -z "${{ secrets.TF_STATE_R2_ENDPOINT }}" ]; then
            echo "::error::Configure TF_STATE_R2_BUCKET and TF_STATE_R2_ENDPOINT repo secrets. See docs/platform-provision.md"
            exit 1
          fi

      - name: Terraform init (R2 backend)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_R2_BUCKET }}" \
            -backend-config="key=home-dashboard/hub.tfstate" \
            -backend-config="region=auto" \
            -backend-config='endpoints={s3="${{ secrets.TF_STATE_R2_ENDPOINT }}"}' \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="use_path_style=true"

      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Verify Cloudflare API token
        run: bash scripts/verify-cloudflare-api-token.sh

      - name: Deprovision hub site
        run: |
          ARGS=( "${{ inputs.site_id }}" )
          if [ "${{ inputs.skip_platform_admin }}" = "true" ]; then ARGS+=( --skip-platform-admin ); fi
          node scripts/deprovision-hub-site.mjs "${ARGS[@]}"

      - name: Commit deprovisioned site manifest
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          SITE_ID: ${{ inputs.site_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PLATFORM_GITHUB_TOKEN not set — skipping manifest commit. Run npm run platform:manifest and commit it, or the torn-down site keeps a contract in git."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add platform-admin/public/platform-manifest.json
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          BRANCH="platform/deprovision-${SITE_ID}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "platform: drop ${SITE_ID} contract from platform manifest"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          gh pr create \
            --title "platform: drop ${SITE_ID} contract from platform manifest" \
            --body "$(cat <<EOF
          Automated deprovision follow-up from **Platform site deprovision**.

          Site \`${SITE_ID}\` was destroyed (Terraform + Worker). This PR rebuilds \`platform-admin/public/platform-manifest.json\` from live Terraform output so the dead site stops carrying D1/R2 ids and Access AUDs in git.

          Without it the committed manifest keeps the torn-down contract, and a later signup reusing the same slug inherits those ids until Terraform runs.

          Auto-merge runs when required checks pass (see \`platform-site-pr-automerge.yml\`).
          EOF
          )" \
            --base main \
            --head "$BRANCH"

      - name: Prune HUB_PROXY_SECRETS_JSON
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          SITE_ID: ${{ inputs.site_id }}
        run: node scripts/prune-hub-proxy-secrets-github-secret.mjs
