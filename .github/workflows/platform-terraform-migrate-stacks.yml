name: Split Terraform state stacks

# One-shot: copy hub.tfstate into platform.tfstate + customers.tfstate.
# Does not delete the legacy object. Do not run provision/deprovision until this succeeds.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type split-stacks to migrate hub.tfstate into the two ring-fenced backends
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-terraform-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      TF_STATE_R2_BUCKET: ${{ secrets.TF_STATE_R2_BUCKET }}
      TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Confirm
        run: |
          if [ "${{ inputs.confirm }}" != "split-stacks" ]; then
            echo "::error::Type split-stacks in the confirm input to run this migration."
            exit 1
          fi
          if [ -z "${{ secrets.TF_STATE_R2_BUCKET }}" ] || [ -z "${{ secrets.TF_STATE_R2_ENDPOINT }}" ]; then
            echo "::error::Configure TF_STATE_R2_BUCKET and TF_STATE_R2_ENDPOINT."
            exit 1
          fi

      - name: Split and push backends
        run: bash scripts/migrate-terraform-state-stacks.sh split-stacks
