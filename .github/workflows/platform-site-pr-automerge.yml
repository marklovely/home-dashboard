name: Platform site PR auto-merge

# pull_request_target uses workflow YAML from the base branch (main), not the PR
# head — so a PR cannot replace this job to exfiltrate PLATFORM_GITHUB_TOKEN.
# GitHub does not re-run this workflow on leftover PRs when another site PR
# merges, so we also reconcile on closed+merged and on a one-minute cron.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches:
      - main
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: platform-site-pr-automerge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  automerge:
    if: >-
      github.event_name == 'pull_request_target' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'platform:') &&
      (
        (
          startsWith(github.event.pull_request.head.ref, 'platform/site-') &&
          contains(github.event.pull_request.body, 'Automated site registry change from **Platform Admin**')
        ) ||
        (
          startsWith(github.event.pull_request.head.ref, 'platform/provision-') &&
          contains(github.event.pull_request.body, 'Automated provision follow-up from **Platform site provision**')
        ) ||
        (
          startsWith(github.event.pull_request.head.ref, 'platform/deprovision-') &&
          contains(github.event.pull_request.body, 'Automated deprovision follow-up from **Platform site deprovision**')
        ) ||
        (
          contains(github.event.pull_request.head.ref, '-billing-deprovision-') &&
          contains(github.event.pull_request.body, 'Automated billing deprovision from **Platform billing**')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check PR token
        run: |
          if [ -z "${{ secrets.PLATFORM_GITHUB_TOKEN }}" ]; then
            echo "::error title=Missing PLATFORM_GITHUB_TOKEN::Add repo secret PLATFORM_GITHUB_TOKEN (PAT with contents:write + pull_requests:write)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Replay dirty billing/registry PR onto origin/main
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PLATFORM_GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
        run: node scripts/replay-dirty-platform-pr.mjs "${{ github.event.pull_request.number }}"

      - name: Enable auto-merge (retry while GitHub registers checks)
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          for attempt in $(seq 1 12); do
            if gh pr merge "$pr" --squash --auto 2>/tmp/gh-merge.err; then
              echo "Auto-merge enabled on PR #$pr."
              exit 0
            fi
            err="$(cat /tmp/gh-merge.err)"
            if echo "$err" | grep -qi 'already enabled'; then
              echo "Auto-merge already enabled on PR #$pr."
              exit 0
            fi
            echo "Attempt $attempt/12: $err"
            sleep 15
          done
          echo "::error::Could not enable auto-merge on PR #$pr. Ensure Allow auto-merge is on and main has branch protection with required checks (test, validate). See docs/platform-admin.md."
          exit 1

  reconcile-dirty:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.title, 'platform:')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: platform-registry-reconcile
      cancel-in-progress: true
    steps:
      - name: Check PR token
        run: |
          if [ -z "${{ secrets.PLATFORM_GITHUB_TOKEN }}" ]; then
            echo "::error title=Missing PLATFORM_GITHUB_TOKEN::Add repo secret PLATFORM_GITHUB_TOKEN (PAT with contents:write + pull_requests:write)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Replay dirty automated platform PRs onto origin/main
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PLATFORM_GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
        run: node scripts/reconcile-dirty-platform-prs.mjs
