name = "lovely-home-hub-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[build]
rules = [
  { type = "CommonJS", globs = ["**/node_modules/ical-expander/**", "**/node_modules/ical.js/**"], fallthrough = true }
]

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://marklovely.github.io,https://*.pages.dev"
HOME_LATITUDE = "50.88"
HOME_LONGITUDE = "-1.03"

[[durable_objects.bindings]]
name = "OWNER_AUTH_LIMITER"
class_name = "OwnerAuthLimiter"

# Free Workers plan requires SQLite-backed Durable Objects (new_sqlite_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["OwnerAuthLimiter"]
