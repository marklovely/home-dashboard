name = "lovely-home-hub-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://dashboard.lovely-home.co.uk,https://home-dashboard-a11.pages.dev,https://*.pages.dev"
HOME_LATITUDE = "50.88"
HOME_LONGITUDE = "-1.03"

[[durable_objects.bindings]]
name = "OWNER_AUTH_LIMITER"
class_name = "OwnerAuthLimiter"

[[durable_objects.bindings]]
name = "CONTROL_ACTION_LIMITER"
class_name = "ControlActionLimiter"

# Free Workers plan requires SQLite-backed Durable Objects (new_sqlite_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["OwnerAuthLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ControlActionLimiter"]

# Private PDF storage for appliance user guides (never public).
[[r2_buckets]]
binding = "APPLIANCE_GUIDES"
bucket_name = "lovely-home-appliance-guides"

# Manual metadata (titles, publish state, opaque R2 keys).
[[d1_databases]]
binding = "APPLIANCE_MANUALS_DB"
database_name = "lovely-home-appliance-manuals"
database_id = "6ba7c54d-8804-47c0-8648-77b1aa25e0e0"
migrations_dir = "migrations"

# House Guide CMS (same D1 database, separate binding).
[[d1_databases]]
binding = "HOUSE_GUIDE_DB"
database_name = "lovely-home-appliance-manuals"
database_id = "6ba7c54d-8804-47c0-8648-77b1aa25e0e0"
migrations_dir = "migrations"

# Guide images uploaded via CMS (private).
[[r2_buckets]]
binding = "GUIDE_MEDIA"
bucket_name = "lovely-home-guide-media"

# ---------------------------------------------------------------------------
# Test environment — isolated Worker, D1, and R2 (never shares production data).
# Provision once: cd worker && npm run provision:test
# Deploy: npm run deploy:test
# See docs/cloudflare-test-environment.md
# ---------------------------------------------------------------------------

[env.test]
name = "lovely-home-hub-api-test"

[env.test.vars]
HUB_ENVIRONMENT = "test"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://test.lovely-home.co.uk,https://home-dashboard-test.pages.dev,https://*.home-dashboard-test.pages.dev,https://*.pages.dev"
HOME_LATITUDE = "51.5074"
HOME_LONGITUDE = "-0.1278"

[[env.test.durable_objects.bindings]]
name = "OWNER_AUTH_LIMITER"
class_name = "OwnerAuthLimiter"

[[env.test.durable_objects.bindings]]
name = "CONTROL_ACTION_LIMITER"
class_name = "ControlActionLimiter"

[[env.test.r2_buckets]]
binding = "APPLIANCE_GUIDES"
bucket_name = "lovely-home-appliance-guides-test"

[[env.test.d1_databases]]
binding = "APPLIANCE_MANUALS_DB"
database_name = "lovely-home-appliance-manuals-test"
database_id = "9f700f32-e92d-46cb-af9e-9a42f428aceb"
migrations_dir = "migrations"

[[env.test.d1_databases]]
binding = "HOUSE_GUIDE_DB"
database_name = "lovely-home-appliance-manuals-test"
database_id = "9f700f32-e92d-46cb-af9e-9a42f428aceb"
migrations_dir = "migrations"

[[env.test.r2_buckets]]
binding = "GUIDE_MEDIA"
bucket_name = "lovely-home-guide-media-test"

