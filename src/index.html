<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131a" />
    <meta name="description" content="A fast wall-mounted smart home dashboard." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Home Dashboard</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <section>
          <p class="eyebrow">HOME</p>
          <h1 id="greeting">Good afternoon</h1>
          <p id="date" class="subtle"></p>
        </section>
        <section class="clock-block" aria-label="Current time">
          <div id="clock" class="clock">--:--</div>
          <div id="seconds" class="seconds">--</div>
        </section>
      </header>

      <section class="status-strip" aria-label="Home status">
        <div class="status-card weather-card">
          <span id="weather-icon" class="status-icon">◌</span>
          <div>
            <strong id="weather-temp">Weather</strong>
            <span id="weather-text">Locating…</span>
          </div>
        </div>
        <div class="status-card">
          <span class="status-icon">▰</span>
          <div>
            <strong id="battery-level">Battery</strong>
            <span id="battery-state">Checking…</span>
          </div>
        </div>
        <div class="status-card">
          <span id="network-dot" class="network-dot"></span>
          <div>
            <strong id="network-label">Online</strong>
            <span>Virtual Buttons ready</span>
          </div>
        </div>
      </section>

      <section id="button-grid" class="button-grid" aria-label="Alexa routines"></section>

      <footer class="footer">
        <span id="last-command">No command sent yet</span>
        <span>Home Dashboard v1.0.1</span>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
