<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131a" />
    <meta name="description" content="Lovely Home Hub — a tablet-first home platform for controls, guides, and household apps." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Home Hub</title>
  </head>
  <body>
    <div id="device-session-loading" class="device-session-loading" role="status" aria-live="polite">
      Opening Lovely Home…
    </div>
    <main class="hub-shell hub-shell--session-loading">
      <header class="shell-header">
        <div class="shell-chrome">
          <button type="button" id="shell-home-button" class="shell-home-button">Home</button>
          <div class="shell-chrome-title-block">
            <p id="shell-eyebrow" class="eyebrow">LOVELY HOME HUB</p>
            <h1 id="shell-chrome-title" class="shell-chrome-title">Home Hub</h1>
            <p id="shell-tagline" class="shell-tagline subtle" hidden></p>
          </div>
          <div id="shell-profile-switcher" class="shell-profile-switcher" hidden></div>
          <section class="clock-block" aria-label="Current time">
            <div id="clock" class="clock">--:--</div>
            <div id="seconds" class="seconds">--</div>
          </section>
          <div id="shell-header-weather" class="shell-header-weather" hidden aria-label="Weather summary">
            <span id="shell-weather-icon" class="shell-weather-icon"></span>
            <div class="shell-weather-copy">
              <strong id="shell-weather-temp">—</strong>
              <span id="shell-weather-text" class="subtle">Locating…</span>
            </div>
          </div>
        </div>

        <div id="shell-home-hero" class="shell-home-hero" hidden>
          <div id="shell-home-welcome" class="shell-home-welcome">
            <h2 id="greeting" class="home-greeting">Good afternoon</h2>
            <p id="date" class="home-date"></p>
          </div>
          <button
            type="button"
            id="shell-home-weather"
            class="shell-home-weather"
            aria-label="Open weather"
          >
            <span id="shell-hero-weather-icon" class="shell-home-weather-icon"></span>
            <span class="shell-home-weather-copy">
              <strong id="shell-hero-weather-temp" class="shell-home-weather-temp">—</strong>
              <span id="shell-hero-weather-condition" class="shell-home-weather-condition">Locating…</span>
            </span>
          </button>
        </div>

        <section id="shell-status" class="status-strip" aria-label="Home status">
          <div class="status-card weather-card">
            <span id="weather-icon" class="status-icon">◌</span>
            <div>
              <strong id="weather-temp">Weather</strong>
              <span id="weather-text">Locating…</span>
            </div>
          </div>
          <div class="status-card">
            <span class="status-icon">▰</span>
            <div>
              <strong id="battery-level">Battery</strong>
              <span id="battery-state">Checking…</span>
            </div>
          </div>
          <div class="status-card">
            <span id="network-dot" class="network-dot"></span>
            <div>
              <strong id="network-label">Online</strong>
              <span>Virtual Buttons ready</span>
            </div>
          </div>
        </section>
      </header>

      <div id="app-viewport" class="app-viewport" aria-live="polite"></div>

      <nav id="shell-bottom-nav" class="shell-bottom-nav" hidden aria-label="Main navigation"></nav>

      <footer id="shell-footer" class="footer shell-footer" hidden>
        <span id="last-command">No command sent yet</span>
        <span id="shell-version-label">Home Hub</span>
      </footer>
    </main>

    <div id="screensaver-overlay" class="screensaver-overlay" hidden aria-hidden="true">
      <div class="screensaver-panel" role="status" aria-live="polite">
        <div id="screensaver-clock" class="screensaver-clock">--:--</div>
        <p id="screensaver-date" class="screensaver-date subtle"></p>
        <p class="screensaver-hint">Tap to wake</p>
      </div>
    </div>

    <div id="owner-access-host" class="owner-access-host"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
