<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131a" />
    <meta name="description" content="Sign in to the Lovely Home public demo hub." />
    <title>Lovely Home Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10131a;
        --panel: #1a1f2b;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #7c9cff;
        --danger: #f87171;
        --border: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #1f2937 0%, var(--bg) 55%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 0.875rem;
        margin-bottom: 0.35rem;
      }
      input {
        width: 100%;
        margin-bottom: 1rem;
        padding: 0.75rem 0.85rem;
        border-radius: 0.6rem;
        border: 1px solid var(--border);
        background: #0f141d;
        color: var(--text);
        font-size: 1rem;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.85rem 1rem;
        font-size: 1rem;
        font-weight: 600;
        background: var(--accent);
        color: #0b1020;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .error {
        min-height: 1.25rem;
        margin: 0 0 1rem;
        color: var(--danger);
        font-size: 0.875rem;
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.8125rem;
        color: var(--muted);
        line-height: 1.45;
      }
      .hint a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lovely Home Demo</h1>
      <p>Explore a sample hub with guest home, house guide, pet care, bins, and emergency info. Data resets overnight.</p>
      <form id="demo-login-form">
        <div class="error" id="demo-login-error" aria-live="polite"></div>
        <label for="demo-username">Username</label>
        <input id="demo-username" name="username" autocomplete="username" required />
        <label for="demo-password">Password</label>
        <input id="demo-password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" id="demo-login-submit">Open demo</button>
      </form>
      <p class="hint">
        Owner explore PIN after login: <strong>1234</strong>. Cameras and home controls are not included in this demo.
        <a href="https://lovely-home.co.uk/">Learn more at lovely-home.co.uk</a>
      </p>
    </main>
    <script type="module">
      const form = document.getElementById('demo-login-form');
      const errorEl = document.getElementById('demo-login-error');
      const submitButton = document.getElementById('demo-login-submit');

      async function redirectIfAuthenticated() {
        try {
          const response = await fetch('/api/demo/session', { credentials: 'same-origin' });
          if (!response.ok) return;
          const json = await response.json();
          if (json?.authenticated) {
            window.location.replace('/');
          }
        } catch {
          /* offline */
        }
      }

      form?.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.textContent = '';
        submitButton.disabled = true;

        const username = /** @type {HTMLInputElement} */ (document.getElementById('demo-username')).value;
        const password = /** @type {HTMLInputElement} */ (document.getElementById('demo-password')).value;

        try {
          const response = await fetch('/api/demo/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          if (!response.ok) {
            errorEl.textContent =
              response.status === 401 ? 'Invalid username or password.' : 'Could not sign in. Try again shortly.';
            return;
          }
          window.location.replace('/');
        } catch {
          errorEl.textContent = 'Network error. Check your connection and try again.';
        } finally {
          submitButton.disabled = false;
        }
      });

      void redirectIfAuthenticated();
    </script>
  </body>
</html>
